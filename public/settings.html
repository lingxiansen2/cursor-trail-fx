<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none';" />
    <title>Cursor Trail FX 设置</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface2: #253047;
        --border: #334155;
        --accent: #62d6ff;
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --danger: #f87171;
        --radius: 8px;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      body {
        height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px 14px;
        border-bottom: 1px solid var(--border);
      }

      .header-icon {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--surface);
        color: var(--accent);
        font-size: 18px;
      }

      .header-title {
        font-size: 15px;
        font-weight: 700;
      }

      .header-sub {
        margin-top: 2px;
        font-size: 12px;
        color: var(--text-dim);
      }

      .body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
      }

      .section {
        margin-bottom: 20px;
      }

      .section-title {
        margin-bottom: 10px;
        color: var(--text-dim);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 10px 14px;
        margin-bottom: 8px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        background: var(--surface);
      }

      .row:hover {
        border-color: var(--border);
      }

      .row-label {
        flex: 1;
      }

      .row-label small {
        display: block;
        margin-top: 2px;
        color: var(--text-dim);
        font-size: 11px;
      }

      select,
      input[type="number"],
      input[type="text"] {
        min-height: 30px;
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        background: var(--surface2);
        font: inherit;
        outline: none;
      }

      select:focus,
      input:focus {
        border-color: var(--accent);
      }

      select {
        min-width: 150px;
      }

      input[type="text"] {
        width: 190px;
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 12px;
      }

      input[type="range"] {
        width: 140px;
      }

      .range-value {
        min-width: 48px;
        color: var(--accent);
        text-align: right;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      input[type="color"] {
        width: 42px;
        height: 30px;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface2);
      }

      .color-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .color-hex {
        min-width: 62px;
        color: var(--text-dim);
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 12px;
      }

      .toggle {
        position: relative;
        width: 42px;
        height: 24px;
        flex: 0 0 auto;
      }

      .toggle input {
        display: none;
      }

      .toggle-track {
        position: absolute;
        inset: 0;
        border-radius: 12px;
        background: var(--border);
      }

      .toggle-thumb {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.16s ease;
      }

      .toggle input:checked + .toggle-track {
        background: var(--accent);
      }

      .toggle input:checked ~ .toggle-thumb {
        transform: translateX(18px);
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        border-top: 1px solid var(--border);
      }

      .spacer {
        flex: 1;
      }

      .btn {
        padding: 8px 18px;
        border: 1px solid transparent;
        border-radius: 8px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-primary {
        color: #06111f;
        background: var(--accent);
      }

      .btn-secondary {
        color: var(--text);
        border-color: var(--border);
        background: var(--surface2);
      }

      .status {
        color: var(--accent);
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .status.visible {
        opacity: 1;
      }

      .status.error {
        color: var(--danger);
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--text-dim);
        background: var(--bg);
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="loading">正在加载设置...</div>

    <header class="header">
      <div class="header-icon">✦</div>
      <div>
        <div class="header-title">Cursor Trail FX</div>
        <div class="header-sub">光标拖尾特效设置</div>
      </div>
    </header>

    <main class="body" id="body" hidden>
      <section class="section">
        <div class="section-title">特效</div>
        <div class="row">
          <div class="row-label">特效类型</div>
          <select id="effect"></select>
        </div>
        <div class="row">
          <div class="row-label">
            主色调
            <small>拖尾主体颜色</small>
          </div>
          <div class="color-row">
            <input type="color" id="color" />
            <span class="color-hex" id="color-hex">#62d6ff</span>
          </div>
        </div>
        <div class="row">
          <div class="row-label">
            辅助色调
            <small>光晕和粒子的第二颜色</small>
          </div>
          <div class="color-row">
            <input type="color" id="secondaryColor" />
            <span class="color-hex" id="secondaryColor-hex">#c084fc</span>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-title">渲染参数</div>
        <div class="row">
          <div class="row-label">
            不透明度
            <small>整体拖尾亮度</small>
          </div>
          <input type="range" id="opacity" min="5" max="100" step="1" />
          <span class="range-value" id="opacity-val">92%</span>
        </div>
        <div class="row">
          <div class="row-label">
            拖尾长度
            <small>保留的轨迹点数量</small>
          </div>
          <input type="range" id="trailLength" min="16" max="260" step="4" />
          <span class="range-value" id="trailLength-val">120</span>
        </div>
        <div class="row">
          <div class="row-label">
            粒子数量
            <small>同屏最大粒子数</small>
          </div>
          <input type="range" id="particleCount" min="10" max="260" step="5" />
          <span class="range-value" id="particleCount-val">120</span>
        </div>
        <div class="row">
          <div class="row-label">
            线条宽度
            <small>拖尾线宽，单位像素</small>
          </div>
          <input type="range" id="lineWidth" min="2" max="44" step="1" />
          <span class="range-value" id="lineWidth-val">14px</span>
        </div>
        <div class="row">
          <div class="row-label">
            补帧采样率
            <small>实际显示跟随屏幕刷新率，低刷屏按该速率插值补点</small>
          </div>
          <input type="range" id="fpsCap" min="120" max="360" step="5" />
          <span class="range-value" id="fpsCap-val">240Hz</span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">行为</div>
        <div class="row">
          <div class="row-label">
            默认启用特效
            <small>程序启动后自动显示拖尾</small>
          </div>
          <label class="toggle">
            <input type="checkbox" id="enabled" />
            <span class="toggle-track"></span>
            <span class="toggle-thumb"></span>
          </label>
        </div>
        <div class="row">
          <div class="row-label">
            默认穿透模式
            <small>启动后鼠标点击穿过特效层</small>
          </div>
          <label class="toggle">
            <input type="checkbox" id="clickThroughDefault" />
            <span class="toggle-track"></span>
            <span class="toggle-thumb"></span>
          </label>
        </div>
        <div class="row">
          <div class="row-label">
            开机自动启动
            <small>登录 Windows 时自动运行</small>
          </div>
          <label class="toggle">
            <input type="checkbox" id="autoLaunch" />
            <span class="toggle-track"></span>
            <span class="toggle-thumb"></span>
          </label>
        </div>
      </section>

      <section class="section">
        <div class="section-title">快捷键</div>
        <div class="row">
          <div class="row-label">切换下一个效果</div>
          <input type="text" id="hotkey-nextEffect" placeholder="CommandOrControl+Alt+J" />
        </div>
        <div class="row">
          <div class="row-label">开启 / 关闭特效</div>
          <input type="text" id="hotkey-toggleEnabled" placeholder="CommandOrControl+Alt+K" />
        </div>
        <div class="row">
          <div class="row-label">切换穿透模式</div>
          <input type="text" id="hotkey-toggleInteractive" placeholder="CommandOrControl+Alt+P" />
        </div>
      </section>
    </main>

    <footer class="footer">
      <button class="btn btn-secondary" id="btn-userdata">数据目录</button>
      <div class="spacer"></div>
      <span class="status" id="status"></span>
      <button class="btn btn-secondary" id="btn-cancel">取消</button>
      <button class="btn btn-primary" id="btn-save">保存并应用</button>
    </footer>

    <script src="./settings.js"></script>
  </body>
</html>
